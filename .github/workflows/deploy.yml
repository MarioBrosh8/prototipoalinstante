name: Deploy

# Every push and PR is type-checked and built. Pushes to main are also
# deployed to https://prototipoalinstante.mariovaldez.dev, but only once the
# repository has the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID
# variable (see README). Without them the run builds and leaves a notice.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Skip deploy (no token yet)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Sin el secret CLOUDFLARE_API_TOKEN el sitio no se despliega desde Actions. Despliega con npm run deploy o agrega el token (ver README)."
